name: Rebuild course
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-science fonts-texgyre fonts-liberation libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libjpeg-dev libtiff-dev libnlopt-dev
      - name: Restore recorded packages
        run: Rscript --vanilla scripts/setup.R
      - name: Verify companion package and integrity guard
        run: Rscript --vanilla scripts/check-companion.R
      - name: Rebuild HTML and PDF
        run: |
          Rscript --vanilla scripts/build.R all 2>&1 | tee course-build.log
          Rscript --vanilla -e 'if (any(grepl("Package .* Warning|LaTeX Warning", readLines("course-build.log")))) stop("LaTeX warnings remain; inspect course-build.log")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-build-log
          path: course-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: course-html-pdf
          path: docs/

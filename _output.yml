bookdown::gitbook:
  code_folding: hide
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Econometrics and Statistics</a></li>
      after: |
        <li class="book-license">© 2026 Jean-Paul Renne — <a href="https://creativecommons.org/licenses/by/4.0/" target="blank">CC BY 4.0</a></li>
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/jrenne/EcoStat/edit/main/%s
    download: ["pdf"]
bookdown::pdf_book:
  includes:
    in_header: [preamble.tex, pdf-modern.tex]
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
bookdown::bs4_book: default
